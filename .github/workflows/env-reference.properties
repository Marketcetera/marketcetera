# Database Configuration
# These properties are set as environment variables in GitHub Actions
metc.jdbc.password=${METC_JDBC_PASSWORD}
metc.jdbc.driver=${METC_JDBC_DRIVER}
metc.jdbc.url=${METC_JDBC_URL}
metc.jdbc.testquery=${METC_JDBC_TESTQUERY}
metc.hibernate.dialect=${METC_HIBERNATE_DIALECT}
metc.flyway.vendor=${METC_FLYWAY_VENDOR}

