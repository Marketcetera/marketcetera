# Jakarta EE compatibility settings for tests

# CXF configuration
org.apache.cxf.stax.allowInsecureParser=1
org.apache.cxf.binding.soap.messageFactoryClassName=com.sun.xml.messaging.saaj.soap.ver1_2.SOAPMessageFactory1_2Impl
org.apache.cxf.service.factory.enableWrapperStyle=true
org.apache.cxf.service.factory.allowImportOfType=true
org.apache.cxf.feature.use-jaf-serialization=false

# Jetty configuration
org.eclipse.jetty.server.Request.maxFormKeys=1000
org.eclipse.jetty.server.session.idleTimeout=3600000
org.eclipse.jetty.client.http.maxConnectionsPerDestination=100
org.eclipse.jetty.server.http.pathMapIgnoreCase=false

# JAXB/XML configuration
jakarta.xml.bind.context.factory=org.eclipse.persistence.jaxb.JAXBContextFactory
javax.xml.accessExternalDTD=all